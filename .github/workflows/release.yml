name: Release packaging

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package-release.sh
      - docs/INSTALL.md
      - cmd/aihostcheck/**
      - internal/**
      - go.mod
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Package ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Select package version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Release tag must use semantic versioning, for example v0.1.0" >&2
              exit 1
            fi
            echo "PACKAGE_VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "PACKAGE_VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
      - name: Build archive
        shell: bash
        run: ./scripts/package-release.sh "${{ matrix.goos }}" "${{ matrix.goarch }}" "$PACKAGE_VERSION" dist
      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          path: dist/aihostcheck_*
          archive: false
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: aihostcheck_*
          path: release
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: |
          cd release
          sha256sum aihostcheck_* > checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          gh release create "$GITHUB_REF_NAME" release/*
          --verify-tag
          --generate-notes
          --title "AIHostCheck $GITHUB_REF_NAME"
