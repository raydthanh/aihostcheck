name: Release packaging

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - .github/workflows/release.yml
      - scripts/package-release.sh
      - docs/INSTALL.md
      - cmd/aihostcheck/**
      - internal/**
      - go.mod
      - CHANGELOG.md
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Package ${{ matrix.goos }}/${{ matrix.goarch }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'closed' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Select package version
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            package_version="$GITHUB_REF_NAME"
          elif [[ "${RELEASE_BRANCH:-}" == release/v* ]]; then
            package_version="${RELEASE_BRANCH#release/}"
          else
            package_version="dev-${GITHUB_SHA::7}"
          fi
          if [[ ! "$package_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ &&
                ! "$package_version" =~ ^dev-[0-9a-f]{7}$ ]]; then
            echo "Version must use semantic versioning, for example v0.1.0" >&2
            exit 1
          fi
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"
      - name: Build archive
        shell: bash
        run: ./scripts/package-release.sh "${{ matrix.goos }}" "${{ matrix.goarch }}" "$PACKAGE_VERSION" dist
      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          path: dist/aihostcheck_*
          archive: false
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Verify release assets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: aihostcheck_*
          path: release
          merge-multiple: true
          skip-decompress: true
      - name: Create checksums
        shell: bash
        run: |
          cd release
          shopt -s nullglob
          archives=(aihostcheck_*)
          if [[ "${#archives[@]}" -ne 6 ]]; then
            echo "Expected six release archives, found ${#archives[@]}" >&2
            exit 1
          fi
          for archive in "${archives[@]}"; do
            if [[ ! -f "$archive" ]]; then
              echo "Release asset is not a file: $archive" >&2
              exit 1
            fi
          done
          sha256sum "${archives[@]}" > checksums.txt
      - name: Upload verified release bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/v'))
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: release
      - name: Select release version
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "PACKAGE_VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "PACKAGE_VERSION=${RELEASE_BRANCH#release/}" >> "$GITHUB_ENV"
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          prerelease=()
          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$PACKAGE_VERSION" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag --generate-notes --fail-on-no-commits \
              --title "AIHostCheck $PACKAGE_VERSION" "${prerelease[@]}"
          else
            gh release create "$PACKAGE_VERSION" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "${RELEASE_TARGET:-$GITHUB_SHA}" \
              --generate-notes --fail-on-no-commits \
              --title "AIHostCheck $PACKAGE_VERSION" "${prerelease[@]}"
          fi
