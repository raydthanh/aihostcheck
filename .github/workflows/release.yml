name: Release packaging

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - .github/workflows/release.yml
      - scripts/package-release.sh
      - docs/INSTALL.md
      - docs/DISTRIBUTION.md
      - cmd/aihostcheck/**
      - internal/**
      - go.mod
      - CHANGELOG.md
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Package ${{ matrix.goos }}/${{ matrix.goarch }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'closed' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Select package version
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            package_version="$GITHUB_REF_NAME"
          elif [[ "${RELEASE_BRANCH:-}" == release/v* ]]; then
            package_version="${RELEASE_BRANCH#release/}"
          else
            package_version="dev-${GITHUB_SHA::7}"
          fi
          if [[ ! "$package_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ &&
                ! "$package_version" =~ ^dev-[0-9a-f]{7}$ ]]; then
            echo "Version must use semantic versioning, for example v0.1.0" >&2
            exit 1
          fi
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"
      - name: Build archive
        shell: bash
        run: ./scripts/package-release.sh "${{ matrix.goos }}" "${{ matrix.goarch }}" "$PACKAGE_VERSION" dist
      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: dist/aihostcheck_*
          archive: false
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Verify release assets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: aihostcheck_*
          path: release
          merge-multiple: true
          skip-decompress: true
      - name: Create checksums
        shell: bash
        run: |
          cd release
          shopt -s nullglob
          archives=(aihostcheck_*)
          if [[ "${#archives[@]}" -ne 6 ]]; then
            echo "Expected six release archives, found ${#archives[@]}" >&2
            exit 1
          fi
          for archive in "${archives[@]}"; do
            if [[ ! -f "$archive" ]]; then
              echo "Release asset is not a file: $archive" >&2
              exit 1
            fi
          done
          sha256sum "${archives[@]}" > checksums.txt
      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-bundle
          path: release/*
          if-no-files-found: error
          retention-days: 7

  verify-install:
    name: Verify install on ${{ matrix.platform }}
    needs: assemble
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-latest
            target_os: linux
          - platform: macOS
            runner: macos-latest
            target_os: darwin
          - platform: Windows
            runner: windows-latest
            target_os: windows
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-bundle
          path: release
      - name: Verify, extract, and run Unix archive
        if: runner.os != 'Windows'
        env:
          TARGET_OS: ${{ matrix.target_os }}
        shell: bash
        run: |
          case "$RUNNER_ARCH" in
            X64) target_arch=amd64 ;;
            ARM64) target_arch=arm64 ;;
            *) echo "Unsupported runner architecture: $RUNNER_ARCH" >&2; exit 1 ;;
          esac
          archive_pattern="*_${TARGET_OS}_${target_arch}.tar.gz"
          shopt -s nullglob
          archives=(release/$archive_pattern)
          if [[ "${#archives[@]}" -ne 1 ]]; then
            echo "Expected one archive matching $archive_pattern, found ${#archives[@]}" >&2
            exit 1
          fi
          archive="${archives[0]}"
          filename="$(basename "$archive")"
          checksum_line="$(awk -v name="$filename" '$2 == name { print }' release/checksums.txt)"
          if [[ -z "$checksum_line" ]]; then
            echo "No checksum found for $filename" >&2
            exit 1
          fi
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            printf '%s\n' "$checksum_line" | (cd release && shasum -a 256 -c -)
          else
            printf '%s\n' "$checksum_line" | (cd release && sha256sum -c -)
          fi
          mkdir install
          tar -xzf "$archive" -C install
          binary="$(find install -type f -name aihostcheck -print -quit)"
          test -n "$binary"
          "$binary" --version
          "$binary" --json > report.json
          test -s report.json
      - name: Verify, extract, and run Windows archive
        if: runner.os == 'Windows'
        env:
          TARGET_OS: ${{ matrix.target_os }}
        shell: pwsh
        run: |
          $targetArch = switch ($env:RUNNER_ARCH) {
            "X64" { "amd64" }
            "ARM64" { "arm64" }
            default { throw "Unsupported runner architecture: $env:RUNNER_ARCH" }
          }
          $archivePattern = "*_$($env:TARGET_OS)_$targetArch.zip"
          $archives = @(Get-ChildItem -Path release -Filter $archivePattern)
          if ($archives.Count -ne 1) {
            throw "Expected one archive matching $archivePattern, found $($archives.Count)"
          }
          $archive = $archives[0]
          $match = @(Select-String -Path release/checksums.txt -Pattern ("  " + [regex]::Escape($archive.Name) + "$"))
          if ($match.Count -ne 1) {
            throw "Expected one checksum for $($archive.Name)"
          }
          $expected = ($match[0].Line -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Checksum mismatch for $($archive.Name)"
          }
          Expand-Archive -Path $archive.FullName -DestinationPath install
          $binary = Get-ChildItem -Path install -Recurse -Filter aihostcheck.exe | Select-Object -First 1
          if ($null -eq $binary) {
            throw "aihostcheck.exe was not found after extraction"
          }
          & $binary.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "--version failed" }
          & $binary.FullName --json | Set-Content -Encoding utf8 report.json
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path report.json)) { throw "--json failed" }

  publish:
    name: Publish GitHub release
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/v'))
    needs: [assemble, verify-install]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-bundle
          path: release
      - name: Select release version
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "PACKAGE_VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "PACKAGE_VERSION=${RELEASE_BRANCH#release/}" >> "$GITHUB_ENV"
          fi
      - name: Attest release archive provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          prerelease=()
          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$PACKAGE_VERSION" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag --generate-notes --fail-on-no-commits \
              --title "AIHostCheck $PACKAGE_VERSION" "${prerelease[@]}"
          else
            gh release create "$PACKAGE_VERSION" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "${RELEASE_TARGET:-$GITHUB_SHA}" \
              --generate-notes --fail-on-no-commits \
              --title "AIHostCheck $PACKAGE_VERSION" "${prerelease[@]}"
          fi
